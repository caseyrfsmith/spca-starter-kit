name: SPCA contract checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate sample passing artifact
        run: python tools/validate.py examples/pass.md
      - name: Verify bad artifact is rejected
        run: |
          if python tools/validate.py examples/fail.md; then
            echo 'Expected fixture to fail' >&2
            exit 1
          fi
